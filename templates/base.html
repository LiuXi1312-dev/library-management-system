<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{% block title %}图书管理系统{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #24292f; }
  header { background: #24292f; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: #fff; text-decoration: none; margin-left: 16px; font-size: 14px; }
  .wrap { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eef0f2; text-align: left; }
  th { background: #fafbfc; font-weight: 600; }
  .btn { display: inline-block; padding: 5px 12px; border: 1px solid #1f6feb; border-radius: 6px;
         background: #1f6feb; color: #fff; font-size: 13px; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: #fff; color: #1f6feb; }
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  input, select { padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.danger { background: #ffebe9; color: #cf222e; }
  .tag.warn { background: #fff8c5; color: #9a6700; }
  .tag.ok { background: #dafbe1; color: #1a7f37; }
  .flash { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  .flash.ok { background: #dafbe1; color: #1a7f37; }
  .flash.warn { background: #fff8c5; color: #9a6700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .book { border: 1px solid #e3e5e8; border-radius: 8px; padding: 12px; background: #fff; }
  .muted { color: #6e7781; font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong>图书管理系统</strong>
  <nav>
    {% if session.get('user_id') %}
      <span class="muted">{{ session.get('name') }}（{{ session.get('role') }}）</span>
      <a href="{{ url_for('index') }}">首页</a>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </nav>
</header>
<div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
